<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instrução Visual por Fotos, Vídeos e Áudios</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { font-size: 1.5em; }
    #preview { display: flex; flex-wrap: wrap; gap: 15px; }
    .item { border: 1px solid #ccc; border-radius: 8px; padding: 10px; width: 200px; background: #f9f9f9; position: relative; }
    .item img, .item video { width: 100%; border-radius: 5px; }
    .item audio { width: 100%; }
    .item textarea, .item input { width: 100%; margin-top: 5px; }
    .btns { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .item .remove { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }
    .drag-handle { cursor: grab; background: #ddd; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; display: inline-block; margin-bottom: 5px; }
  </style>
</head>
<body>

<h1>📸 Instrução por Fotos, Vídeos e Áudios</h1>

<!-- Botões de ação para capturar mídias -->
<div class="btns">
  <button onclick="openCamera()">📷 Tirar Foto</button>
  <button onclick="startVideoRecording()">🎥 Gravar Vídeo</button>
  <button onclick="startAudioRecording()">🎤 Gravar Áudio</button>
  <button onclick="saveSequence()">💾 Salvar</button>
  <button onclick="loadSequence()">📂 Carregar</button>
  <button onclick="exportAsHTML()">🌐 Exportar HTML</button>
  <button onclick="exportAsPDF()">📄 Exportar PDF</button>
  <button onclick="clearAll()">🗑 Limpar Tudo</button>
</div>

<hr>

<div id="preview"></div>

<!-- Câmera para tirar fotos -->
<div id="camera" style="display: none;">
  <video id="videoElement" width="320" height="240" autoplay></video>
  <button onclick="capturePhoto()">Tirar Foto</button>
  <button onclick="closeCamera()">Fechar Câmera</button>
</div>

<!-- Gravação de áudio -->
<div id="audioControls" style="display: none;">
  <button onclick="stopAudioRecording()">Parar Gravação</button>
  <audio id="audioPlayback" controls></audio>
</div>

<!-- jsPDF for PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  let photoList = [];
  let videoBlob = null;
  let audioBlob = null;
  let mediaRecorder;
  let audioRecorder;
  
  // Capturar foto
  function openCamera() {
    navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: { exact: "environment" } } // Forçar o uso da câmera traseira
    })
      .then(stream => {
        const videoElement = document.getElementById('videoElement');
        videoElement.srcObject = stream;
        videoElement.style.display = 'block';
        document.getElementById('camera').style.display = 'block';
      })
      .catch(error => console.error("Erro ao acessar a câmera", error));
  }

  function capturePhoto() {
    const videoElement = document.getElementById('videoElement');
    const canvas = document.createElement('canvas');
    canvas.width = videoElement.videoWidth;
    canvas.height = videoElement.videoHeight;
    canvas.getContext('2d').drawImage(videoElement, 0, 0);
    const photoData = canvas.toDataURL('image/png');
    photoList.push({ src: photoData, title: "", description: "", type: "image" });
    updatePreview();
    closeCamera();
  }

  function closeCamera() {
    const videoElement = document.getElementById('videoElement');
    const stream = videoElement.srcObject;
    const tracks = stream.getTracks();
    tracks.forEach(track => track.stop());
    document.getElementById('camera').style.display = 'none';
  }

  // Gravar vídeo
  function startVideoRecording() {
    navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: { exact: "environment" } } // Forçar o uso da câmera traseira
    })
      .then(stream => {
        const videoElement = document.createElement('video');
        videoElement.srcObject = stream;
        videoElement.controls = true;
        videoElement.style.width = '100%';
        document.getElementById('preview').appendChild(videoElement);

        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = event => {
          videoBlob = event.data;
          const videoUrl = URL.createObjectURL(videoBlob);
          videoElement.src = videoUrl;
          photoList.push({ src: videoUrl, title: "", description: "", type: "video" });
        };

        mediaRecorder.start();
        setTimeout(() => {
          stopVideoRecording(stream);
        }, 10000); // Gravação por 10 segundos
      })
      .catch(error => console.error("Erro ao acessar o vídeo", error));
  }

  function stopVideoRecording(stream) {
    mediaRecorder.stop();
    stream.getTracks().forEach(track => track.stop());
  }

  // Gravar áudio
  function startAudioRecording() {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        audioRecorder = new MediaRecorder(stream);
        audioRecorder.ondataavailable = event => {
          audioBlob = event.data;
          const audioUrl = URL.createObjectURL(audioBlob);
          document.getElementById('audioPlayback').src = audioUrl;
          photoList.push({ src: audioUrl, title: "", description: "", type: "audio" });
        };

        audioRecorder.start();
        document.getElementById('audioControls').style.display = 'block';
      })
      .catch(error => console.error("Erro ao acessar o áudio", error));
  }

  function stopAudioRecording() {
    audioRecorder.stop();
    document.getElementById('audioControls').style.display = 'none';
  }

  // Atualizar a visualização
  function updatePreview() {
    const preview = document.getElementById('preview');
    preview.innerHTML = '';
    photoList.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'item';
      div.draggable = true;
      div.ondragstart = (e) => e.dataTransfer.setData('text/plain', index);
      div.ondragover = (e) => e.preventDefault();
      div.ondrop = (e) => {
        const from = e.dataTransfer.getData('text/plain');
        const to = index;
        const moved = photoList.splice(from, 1)[0];
        photoList.splice(to, 0, moved);
        updatePreview();
      };

      div.innerHTML = `
        <div class="drag-handle">☰</div>
        <button class="remove" onclick="removePhoto(${index})">×</button>
        ${item.type === "image" ? `<img src="${item.src}" />` : ''}
        ${item.type === "video" ? `<video src="${item.src}" controls></video>` : ''}
        ${item.type === "audio" ? `<audio src="${item.src}" controls></audio>` : ''}
        <input placeholder="Título" value="${item.title}" oninput="photoList[${index}].title = this.value" />
        <textarea rows="3" placeholder="Descrição" oninput="photoList[${index}].description = this.value">${item.description}</textarea>
      `;
      preview.appendChild(div);
    });
  }

  function removePhoto(index) {
    photoList.splice(index, 1);
    updatePreview();
  }

  // Funções para salvar e carregar
  function saveSequence() {
    localStorage.setItem('mediaSequence', JSON.stringify(photoList));
    alert('Sequência salva!');
  }

  function loadSequence() {
    const saved = localStorage.getItem('mediaSequence');
    if (saved) {
      photoList = JSON.parse(saved);
      updatePreview();
    } else {
      alert('Nenhuma sequência salva.');
    }
  }

  function clearAll() {
    if (confirm("Deseja limpar tudo?")) {
      photoList = [];
      localStorage.removeItem('mediaSequence');
      updatePreview();
    }
  }

  // Exportar HTML
  function exportAsHTML() {
    const htmlContent = photoList.map(item => `
      <div>
        <h2>${item.title}</h2>
        <p>${item.description}</p>
        ${item.type === 'image' ? `<img src="${item.src}" />` : ''}
        ${item.type === 'video' ? `<video src="${item.src}" controls></video>` : ''}
        ${item.type === 'audio' ? `<audio src="${item.src}" controls></audio>` : ''}
      </div>
    `).join('');
    const blob = new Blob([htmlContent], { type: 'text/html' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'instrucao.html';
    link.click();
  }

  // Exportar PDF
  function exportAsPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();
    let yPosition = 20;

    photoList.forEach(item => {
      if (item.type === 'image') {
        const img = new Image();
        img.src = item.src;
        const ratio = img.width / img.height;
        const width = 180;
        const height = width / ratio;
        pdf.addImage(item.src, 'PNG', 10, yPosition, width, height);
        yPosition += height + 10;
      } else if (item.type === 'video' || item.type === 'audio') {
        pdf.text(`Mídia: ${item.type}`, 10, yPosition);
        yPosition += 10;
      }
      pdf.text(item.description, 10, yPosition);
      yPosition += 20;
    });

    pdf.save('instrucao.pdf');
  }
</script>

</body>
</html>
